[package]
name = "tsc_rs_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TypeScript compiler for WebAssembly — compile and type-check TypeScript anywhere"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tsc_rs_ast = { path = "../tsc_rs_ast" }
tsc_rs_scanner = { path = "../tsc_rs_scanner" }
tsc_rs_parser = { path = "../tsc_rs_parser" }
tsc_rs_emitter = { path = "../tsc_rs_emitter" }
tsc_rs_symbols = { path = "../tsc_rs_symbols" }
tsc_rs_types = { path = "../tsc_rs_types" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
